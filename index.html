<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Audioguys Music Tools — 음악 유통, 메타데이터, 정산 및 파트너 시스템을 위한 업무 도구 허브"
    />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#171717" />
    <title>Audioguys Music Tools</title>

    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css"
  />
  
  <link rel="stylesheet" href="./styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>

    <header class="site-header">
      <div class="container header-inner">
        <div class="header-brand-group">
          <a class="brand" href="./" aria-label="Audioguys Music Tools 홈">
            Audioguys Music <small>Tools</small>
          </a>

          <a
            class="audioguy-link"
            href="https://audioguy2026.vercel.app/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="AUDIOGUY 홈페이지 열기 (새 탭)"
          >
            AUDIOGUY ↗
          </a>
        </div>

        <a
          class="creator-pill"
          href="mailto:kunwu@audioguyrecords.com"
          aria-label="만든이 이건우에게 이메일 보내기"
        >
          <span class="creator-prefix">만든이 ·</span>
          <span>이건우</span>
        </a>
      </div>
    </header>

    <main id="main-content">
      <section class="hero" aria-labelledby="page-title">
        <div class="container">
          <h1 class="sr-only">Audioguys Music Tools</h1>
          <div class="search-wrap">
            <label class="sr-only" for="resource-search">
              도구 또는 서비스 검색
            </label>

            

            <input
              id="resource-search"
              class="resource-search"
              type="search"
              placeholder="도구·서비스 검색"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="search-result-summary"
            />

            <button id="clear" type="button" aria-label="검색어 지우기" hidden>×</button><kbd class="search-shortcut" aria-hidden="true">/</kbd>
          </div>

          <p
            id="search-result-summary"
            class="search-result-summary"
            aria-live="polite"
            aria-atomic="true"
          >
            
          </p>
        </div>
      </section>

      <section
        id="quick-access-section"
        class="resource-section quick-access-section"
        aria-labelledby="pinned-title"
      >
        <div class="container">
          <div class="section-heading">
            <div>
              
              <h2 id="pinned-title">자주 쓰는 도구</h2>
            </div>
            
          </div>

          <div id="pinned-grid" class="pinned-grid"></div>
        </div>
      </section>

      <section class="filter-section" aria-label="카테고리 필터">
        <div class="container">
          <div
            id="category-filters"
            class="filter-list"
            aria-label="도구 카테고리"
          >
            <!-- app.js에서 생성 -->
          </div>
        </div>
      </section>

      <section
        class="resource-section all-resources-section"
        aria-labelledby="all-tools-title"
      >
        <div class="container">
          <div class="section-heading">
            <div>
              
              <h2 id="all-tools-title">전체 도구·서비스</h2>
            </div>

            <p id="resource-count" aria-live="polite" aria-atomic="true"></p>
          </div>

          <button id="all-search" hidden>전체에서 검색</button>
          <p
            id="empty-state"
            class="empty-state"
            role="status"
            aria-live="polite"
            hidden
          >
            일치하는 항목이 없습니다. <button id="reset">필터 초기화</button>
          </p>

          <div id="resource-groups"></div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <p>Audioguys Music Tools · Music Operations Hub</p>
        
      </div>
    </footer>

    <template id="resource-card-template">
      <a
        class="resource-card"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="card-default">
          <span
            class="resource-icon"
            aria-hidden="true"
            hidden
          ></span>
    
          <img class="resource-logo" alt="" hidden />
    
          <span class="card-copy"><span class="resource-name"></span><span class="resource-description"></span></span>
        </span>
    
        
      </a>
    </template>

    <script src="./app.js"></script>
  </body>
</html>
